<!-- 수정 페이지는 원래 스타일이 똑같고 정보만 남아있음. -->
 <!-- 그래서 css 를 write와 같이사용 -->
 <!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글 수정</title>
    <!-- 외부 스타일 시트 연결 -->
     <link rel="stylesheet" href="../css/write.css">
     <!-- ../ 나가서 css 폴더 안에 있는 write.css -->
</head>
<body>
    <!-- 콘텐츠 표시영역 -->
     <div class="board_wrap">
        <!-- 1. 제목 영역 -->
         <div class="board_title">
            <h2>게시글 작성 영역(글작성, 버튼)</h2>
            <p>자유롭게 게시글을 작성하며 이야기를 나누세요</p>

         </div>

        <!-- 2. 게시글 작성 영역(글작성, 버튼) -->
         <div class="board_write_wrap">

            <!-- 작성한 글을 서버에 전송해야 하기에..form 요소 사용 -->
             <!-- AJAX로도 할수 있음. -->
              <form action="../backend/board/updateBoard.php" method="post">

                    <!-- 3교시 시작 -->
                     <!-- 2.1 게시글 작성 영역 -->
                      <div class="board_write">
                        <!-- 2.1.1 제목 작성 영역 [ JS or php로 데이터를 불러와서 적용]-->
                         <div class="title">
                            <div class="col_label">제목</div>
                            <div class="col_input"><input type="text" placeholder="제목입력" value="글 제목#1"></div>
                            <!-- value는 수정이니 기존에 있던 것과 같게 하기 위해 넣음. -->

                         </div>
                         <!-- 2.1.2 글쓴이/ 비밀번호 -->
                          <div class="info">
                            <div class="writer">
                                <div class="col_label">글쓴이</div>
                                <div class="col_input"><input type="text" placeholder="글쓴이 입력" value="sam"></div>

                            </div>
                            <div class="password">
                                <div class="col_label">비밀번호</div>
                                <div class="col_input"><input type="password" placeholder="비밀번호 입력" value="1111"></div>
                             </div>
                            </div>
                         <!-- 2.1.3 글 내용 입력 영역 -->
                          <div class="content">
                            <!-- [js or php로 데이타 적용] -->
                            <textarea name="msg"  placeholder="내용 입력">써 있던 글씨 내용들...</textarea>
                          </div>
                          <!-- 이제 스타일작업하러 가자 .... css. write.css -->

                          </div>

                          


                      <div class="btn_wrap">  
                      <!-- btn_wrap을 쓰는 이유가 있다...  -->
                      <!-- 2.2 새글저장/취소 버튼 영역 -->
                       <input type="submit" value="수정완료"> 
                       <!-- 저장 submit 누르면 서버로 전송 -->
                        <!-- 서버로 전송: 백앤드 관련된 코드를 위한 폴더를 작업해야 함. 그 중에 board에 관한 것만 해서 넣을것이다. -->
                         <!-- 파일 이름은 글을 저장,, DB에 ... 그래서 이름을 insertBoard.php로 하자.. -->
                        <!-- <a href="./view.html?no">취소</a> -->
                        <!-- view.html의 페이지로 가야하닌 view.html?no= 로 하야 함.  -->
                         <input type="button" value="취소" onclick="history.back()">
                         <!-- history 를 담담하는 BOM 이 있었고 거기에 뒤로 가는 함수 -->
                          <!-- 이제 우리는 html과 css를 다 만들었음.. 여기가 front end의 끝 -->
                           <!-- front를 만들떼 가짜 데이타를 가져와서 작업을 함..  -->

                           <!-- 프런트엔드를 다 만들고 데이타는 가짜로 만들어서 홈페이지 스럽게 만들어라... 사용자는 프론트만 보지 백엔드를 못봄 -->
                            <!-- 그래서 먼저 프런트 작업부터 해라. -->
                             <!-- 특히 웹 에이전시들, 하청업체들이 이렇게 함. -->

                             
                      </div>
              </form>

         </div>

     </div>
</body>
</html>

<!-- 서버사이드 렌더링은 php에서 echo할때 모든 html을 다 작성하는 것과 가은 그런 작업. -->
 <!-- 백앤드와 프론트를 다 가지고 있어야 해서 ... 힘듬, 결국 서버에서 html을 만들어서 사용자 브라우저에 보내야 함.. 너무 복잡. -->
 <!-- CSR : 우리가 하는 AJAX를 사용 -->
  <!-- 기본 HTML을 만들고 내용물은 javascript로 만들어서 업데이트 -->
