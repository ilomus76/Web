<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Test</title>

    <!-- 외부 스크립트 연결 -->
    <script src="./01_ex.js"></script>


    
    <!-- 내부 스크립트 작성 -->
     <script>
        // 이 영역안에서는 JS언어의 문법 체계를 따름. 
        document.write('<br>');
        document.write('내부 스크립트 입니다.<br>')

        
     </script>
</head>
<body>
    <!-- 별도 자바스크립트 작성. -->

    <hr>

    <!-- html요소의 속성으로 JS 함수를 사용하는 모습을 "인라인 스크립트"라고 부름.  -->
     <!-- JS 의 함수를 호출. -->
    <button onclick="aaa()">눌러주세요</button>

    
    <!-- 내부 스크립트 작성 -->
     <script>

        // JS 는 어느 곳에서나 작성이 가능하지만 해당 위치에 결과가 나옴.
        // 버튼 아래에 있기 때문에 버튼 아래에 결과가 나롬. 
        document.write('<hr>');
        document.write('aaa')

        
     </script>
</body>
</html>
