<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS object</title>

    <script>
        // JS 에서 객체의 2가지 종류 
        // 1. 내장객체 : document, windown , navigation ...etc...(객체까지) , Date, String, Number , Array....(설계만 있는것)
        // class : 설계도, 객체 : 제품

        //2. 사용자(개발자) 정의 객체


        // 이번시간에는 사용자 정의 객체에 대해 알아보기.
        // 오늘은 문법보다는 객체를 사용하는 것의 효용성을 느끼는 정도만.....

        // 문법은 그냥 그렇구나...정도로...내일 수업에서 문법 소걔 예정..

        // [학생 10명]의 이름 , 나이를 저장.
        var name= 'sam';
        var age = 20;

        var name= 'robbin';
        var age = 25;

        // 이런식으로 10명의 학생얼 저장하려니.. 번수명 .. 짜증.

        //[이름..나이] 묶어서 관리하기 .. [마치.. 파이썬의 딕셔너리처럼....]
        // JS 에서 연관있는 변수들을 묶어서 하나의 관리하는 방법 - 
        var person1 = { name:'sam' , age:20}; // 변수 2개를 멤버로 가지는 녀석(객체), 파이썬에선  { 'name':'sam' , 'age':20}; // 파이썬
        var person2 = { name:'robin' , age:25}; 
        var person3 = { name:'hogn' , age:30}; 


        // [이름,나이] 출력하기.
        document.write('이름:' + person1.name + '<br>');
        document.write('나이:' + person1.name + '<br>');
        document.write('<br>')


        document.write('이름:' + person2.name + '<br>');
        document.write('나이:' + person2.name + '<br>');
        document.write('<br>')

        // 이련 식으로 10명을 직접 ㅜ출력하려니.. 이거 짜증...

        //가만 보니 .. 코드는 같고... 데이터를 가진 객체만 다르면 되지,..........
        //이를 함수로 만들어서... 객첼를 파라미터로 받아 처리하면 재사용 가능
        
        function show_person(person){
            document.write('이름: '+'person.name' + '<br>');
            document.write('나이: '+'person.age' + '<br>');
            document.write('<br>' );
        }

        show_person(person1);
        show_person(person2);
        show_person(person3);


        // 출력기능에 객체를 전달할 필요없이..
        //객체가 데이터를 가지고 있으니. .객에안에 출력 기능까지 있으며...
        // 더 관리가 편하지 않을까?


        // 객체를 만들때... 변수와.. 함수도 같이 만들 수 있음.
        var person4 = {
            name: 'park', 
            age:35,
            show:function(){
                // document.write('이름:' + person.name);
                document.write('이름:' + this.name + '<br>');
                document.write('나이:' + this.name + '<br>');
                document.write('<br>')
            }
        }

        person4.show(); // 객체가 가진 멤버함수를 호출

        //person4 처럼 변수와 함수를 같이 멤버로 가진 녀석을 객체 object라고 부름.
        document.write( typeof(pernson4) + '<hr>');

        // 근데 .. 나머지 5명 학생의 데이터를 저장하려면...객체를 매번 설계해야함.
        // 그래서 매번 멤버의 구조를 만들 수 없으니... 
        // 미리 설계해 놓고.. 필요할 때 마다 객체로 생성하여 사용.
        // [파이썬에선느 설계로를 class라는 키워드로 만들었음.]
        // [JS 에서는 '생성자 함수'라는 방법으로 만들어 사용함. --es6버전에서 calss 키워드 생김.]

        function Person(name, age){ // 첫글자를 대문자로 쓰는 표기법 권장.
            // 멤버 변수.
            this.name= name;
            this.age = age;
            
            // 멤버 함수.
            this.show=function(){  
                document.write('이름:' + this.name + '<br>');
                document.write('나이:' + this.name + '<br>');
                document.write('<br>')
            }
        }

        // 위에서 설계한 '생성자 함수' 구조를 객체를 새로 생성.
        var p1 = new Person('sam',20);   // 새로 생성할 거야...     
        var p2 = new Person('robin',25);
        var p3 = new Person('hong',30);

        p1.show();
        p2.show();
        p3.show();


        
        </script>
    
</head>
<body>
    
</body>
</html>
