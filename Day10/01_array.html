<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array</title>

    <!-- Step1 -->
    <!-- 내부 스크립트 작성-->
      <script>
        // 이 영역안에서는 JS 언어의 문법 체계를 따름. 
        // 태그문은 못알아 들음.

        //배열(Array) - 여러개의 데이터를 하나의 변수로 관리하기 위한 문법(자료구조). 
        //파이썬과는 달리 리스트,튜플,딕션너리 등으로 구분되어 있지 않고 모두 배열로 관리됨. (배열이라고 부름.)


        // JS에서 배열을 만드는 2가지 생성 방법.
        //1. 리터럴 배열 ( literal array : 보여지는 그대로 배열)
        // var aaa=10, 20,30 ; // 에러 . 변수는 하나의 값만 가짐..
        var aaa=[10,20,30]; // 파이썬의 리스트와 같음. 
        // let : ES6 ( 에크마스크 6에서 사용)
        document.write(aaa + '<br>');   // document는 html의 body를 가리키는 객체... 즉 body에 글씨를 쓰겠다.. 라는 것...
        // 배열의 요소값들을 , 구분으로 문자열로 줌. 
        document.write(aaa[0] + '<br>');
        document.write(aaa[1] + '<br>');
        document.write(aaa[2] + '<br>');
        document.write(aaa[3] + '<br>'); // 예외 발생이 아니라.. undefined로 출력 [ 파이썬에서는 예외 발생... (에러가 아니라 예외.) ]
        document.write('<hr>')

        // 요소들의 자료형이 달라도 됨.
        var bbb=[10,'sam',true];
        document.write(bbb[0] + '<br>');
        document.write(bbb[1] + '<br>');
        document.write(bbb[2] + '<br>');
        
        // 배열의 요소 갯수를 확인할 수 있음.
        document.write("요소 개수 : " + bbb.length + '<br>');// 3개   .은 객체가 가지고 있는 기능이라는 이야기...
        
        // 파이썬의 리스트처럼 새로운 요소를 추가할 수 있음. 자바스크립트에서는 파이썬과 달리 튜플은 없다.
        // 파이썬의 리스트처럼 새로운 요소를 추가할 수 있음. [ 새로운 인덱스 번호 사이의 요소는 자동 생성]
        bbb[5] = 100 ; // bbb는 위에서 요소가 3개인데 5번방에 넣고 있는데 나머지 3,4번방은 자동으로 0을 넣고 5에 100을 넣음. 
        document.write("요소 개수 : " + bbb.length + '<br>');
        document.write(bbb[0] + '<br>');
        document.write(bbb[1] + '<br>');
        document.write(bbb[2] + '<br>');
        document.write(bbb[3] + '<br>'); // undefined : 변수는 만들었지만 값은 저장되지 않은 것.
        document.write(bbb[4] + '<br>'); // undefined : 변수는 만들었지만 값은 저장되지 않은 것.
        document.write(bbb[5] + '<br>');
        document.write('<br>');

        // 요소의 값들을 반복문으로 접근하기..
        // for(var n=0;n<6;n++){
        for(var n=0;n<bbb.length;n++){
            document.write(bbb[n] + '<br>');
        }
        document.write('<br>');   


        

        

        //2. Array 객체로 배열 생성.
        var ccc = new Array(10,20,30);// 객체를 묶어서 만들어 달라는 느낌. 객체는 첫자가 대문자... 
        for(var n=0 ; n<ccc.length ; n++){
            document.write(ccc[n] + '<br>');
        }
        document.write('<br>')


        // 위의 것은 오타나면 찾기 힘듦. 그래서 파이썬 처럼 쉽게 보기 위한 방법.
        // 대량이 데이터 요소를 순차적으로 접근할때 사용하는 for in 문법 (파이썬과 다르게 요소값이 아니라 index 번호가 옮.)
        for(var index in ccc){
            // document.write(index + '<br>'); // 인덱스 번호가 옮
            document.write(ccc[index]+'<br>')
        }
        document.write('<br>')

        // 빈 배열객체를 생성한 후에 요소값들을 추가해도 됨. 
        ddd = new Array(); 
        document.write('요소개수 : ' + ddd.length + '<br>');
        
        ddd[0]=100;
        ddd[1]='apple';
        ddd[2]=5>3 ; // true
        ddd[3]=new Date();

        for(var n=0 ; n<ddd.length ; n++){
            document.write(ddd[n] + '<br>');

        }
        document.write('<hr>')


        //----------------------------------------------
        //파이썬의 딕셔너리처럼 인덱스 번호 대신에 '문자열' 키워드로 요소를 구별하는 
        //배열이 존재함. 이를 [ 연관 배열]이라고 부름. associated array , 파이썬에서는 딕션너리라고 했음. 

        // 연관배열 : '키(식별자)'로 인덱스를 대신하는 배열
        var eee = new Array();
        eee['name'] = 'sam';
        eee['age'] = 20;
        eee['address']='seoul';
        document.write('이름 :' + eee['name'] + '<br>' );
        document.write('나이 :' + eee['age'] + '<br>' );
        document.write('주소 :' + eee['address'] + '<br>' );

        //리터럴 배열로도 연관배열 만들 수 있음.
        fff= []; //빈 배열
        fff['aaa']=1000;
        fff['bbb']=2000;

        document.write(fff+'<br>');  // 연관배열은 그대로 출력 안해줌.
        document.write(fff['aaa']+'<br>');
        document.write(fff['bbb']+'<br>');

        document.write('<hr>');

        // 2차원 배열( 1차원 배열을 여러개 가진 배열) : 요소안에 또 배열이 있는 것.
        var ggg = new Array(); // 빈 배열
        var a1 = [10, 20, 30];
        var a2 = ['aa','bb','cc'];
        var a3 = [true, false, false,true];

        ggg[0]= a1;
        ggg[1]= a2;
        ggg[2]= a3;

        document.write(ggg[0]+'<br>');
        document.write(ggg[0][0] + '<br>');
        document.write(ggg[0][1] + '<br>');
        document.write(ggg[0][2] + '<br>');
        document.write('<br>');

        document.write(ggg[1] + '<br>');
        document.write(ggg[1][0] + '<br>');
        document.write(ggg[1][1] + '<br>');
        document.write(ggg[1][2] + '<br>');
        document.write('<br>');
        
        document.write(ggg[2] + '<br>');
        // document.write(ggg[2][0] + '<br>');
        // document.write(ggg[2][1] + '<br>');
        // document.write(ggg[2][2] + '<br>');
        for(var n=0;n<ggg[2].length; n++){
            document.write[ggg[2][n]+'<br>'];
        }
        document.write('<br>');
        


      </script>
</head>
<body>

    
</body>
</html>
