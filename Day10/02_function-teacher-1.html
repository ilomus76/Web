<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>function</title>

    <!-- 내부 스크립트 작성 -->
    <script>
        //1. 함수 정의 및 호출(선언적 함수라고 부름)
        function aaa(){
            document.write('aaa function<br>');
            document.write('Hello<br>');
        }

        aaa(); //함수 호출
        aaa();

        //특이한 점... 함수 정의보다 호출이 먼저 있어도 됨.(why? JS는 script영역의 코드를 실행하기전에 해당 영역의 '선언적함수'들을 먼저 읽어들여 인식함)
        bbb();

        function bbb(){
            document.write('bbb function..<br>');
        }

        // 아래에 작성한 다른 script영역의 함수를 호출해보기
        ccc(); //에러 발생!!
        //에러가 발생하면 사용자가 보는 body 영역에는 아무 표시가 없음.
        //대신 브라우저의 [개발자 도구 F12]의 'console'탭에 에러내용이 표시됨.
        //에러가 발생하는 그 script 영역은 더 이상 코드를 진행하지 않음.
        document.write('첫번째 script 영역 종료<hr>');
        //단, 다른 스크립트는 별도로 이어서 실행됨.
    </script>

    <!-- 또 다른 스크립트 영역 -->
    <script>
        // 위 영역에 있던 선언적 함수를 호출할 수 있나?
        bbb();//OK

        function ccc(){
            document.write('ccc function.....<br>');
        }
    </script>

    <!-- 2. 함수 파라미터에 값 전달하기 -->
    <script>
        document.write('<hr>');

        //값 1개를 전달받는 함수 정의.
        function ddd(a){ //주의! 파라미터(매개변수)를 만들때는 var 키워드가 있으면 안됨.
            document.write(a +'<br>');
        }

        //함수 호출하면서 값 전달하기
        ddd(100);
        ddd('sam');
        ddd(new Date());
        //값을 전달하지 않으면???
        ddd(); //undefined
        document.write('<br>');

        // 매개변수(파라미터) 2개짜리 함수
        function eee(a, b){
            document.write(a + ', ' + b +'<br>');

            //혹시 a와 b에 값이 전달되지 않으면...에러 안내문구..보여주고..덧셈연산을 하지 않도록 ..함수의 동작을 멈추기...
            if(a==undefined || b==undefined){
                document.write('2개의 수를 모두 전달해주세요.<br>');
                return;
            }

            //전달 받은 두 매개변수의 값들을 덧셈하여 결과 출력하기
            var c= a+b;
            document.write('결과: ' + c +'<br>');
        }

        eee(50, 30);
        eee(50); // 50, undefined  -- 50+undefined = NaN (Not a Number)

        //같은 이름의 함수를 또 정의하면.. 덮어쓰기됨(즉, 마지막 정의한 함수내용으로 덮어써짐.)
        //위에서 먼저 호출해던 eee(50,30) 문도...영향 받음.
        function eee(){
            document.write('같은 이름을 또 써버린 eee function<br>');
        }
        eee();

    </script>

    <!-- 3. 함수 실행 후 결과를 리턴받기 -->
    <script>
        document.write('<hr>');

        function ggg(){
            //return 1000; //ggg()함수를 호출한 위치로 1000이라는 값을 가지고 돌아가기
            //return 'sam';
            //return true;
            //return 5>3;
            //return 5+3;
            return new Date();
        }

        var n= ggg(); //ggg함수의 코드가 실행되고..그 return된 값이 이자리를 대체함.
        document.write(n +'<br>');
        document.write('<br>');

        //여러개의 값을 한번에 리턴할 수는 없음.
        function hhh(){
            //return 10,20,30; //여러개의 값 중 마지막 값 1개만 리턴됨.
            //여러개의 값을 리턴하려면.. 배열로 묶어서 리턴해야 함.
            return [10,20,30];
        }

        var m= hhh();
        document.write(m +'<br>');
        document.write(m[0] +'<br>');
    </script> 


</head>
<body>
    
</body>
</html>
