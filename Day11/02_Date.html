<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Object</title>

    <script>

        // JS 에 내장된 유용한 생성자 함수들.. [ Date, Number , String, Math, Array]
        // new 키워드를 이용해서 객체를 생성하여 사용. 

        //1. Date: 날짜와 시간에 관련된.. 기능 및 변수를 설계
        var a = new Date(); // 내가 만들지는 안았지만 내장된 설계 객체여서 난 new로 사용만 하면됨. 
        document.write(a + '<br>') ; // 참조변수를 출력하면 그 객체의 정보를 출력해줌. 
        document.write(typeof(a) +'<br>'); // 모든 객체의 자료형은 object 

        // 주요 기능들(멤버 함수들 -- 메소드)
        document.write(a.toDateString() + '<br>'); 
        document.write(a.toLocaleString() + '<br>'); // 우리 지역에 맞게 시간을 글자로 해줘... 나라마다 시간 다름.
        document.write(a.getYear() + '<br>');   // 1900을 빼고 만듦. 
        document.write(a.getFullYear() + '<br>');
        document.write(a.getMonth() + '<br>'); // 0~11  : 0부터 시작... 
        // document.write(a.getDay() + '<br>'); // 월 ,, 화 ,, 수
        document.write(a.getDate() + '<br>'); 
        document.write(a.getHours() + '<br>'); 
        document.write(a.getMinutes() + '<br>'); 
        document.write(a.getSeconds() + '<br>'); 
        document.write(a.getTime() + '<br>'); // 1970.01.01.09:00 부터 ms 마다 카운트를 센 값 - 파이썬에서 timestamp. 경과 시간 예측. 시작의 stamp 를 하고 종료 stamp를 이용.
        // 시분초로 하면 경과 시간 어려움.
        // 경과 시간 등을 계산할때 사용 [ 종료시간 - 시작시간]
        // Date 객체가 생성될때의 시간으로 설정됨. 
        // 이를 변경할 수도 있음.

        var b = new Date(); // 현재 시간으로 만들어짐.
         document.write(b.toLocaleString() + '<br>');
         b.setFullYear(2027);
         document.write(b.toLocaleString() + '<br>'); 

         // 객체를 생성할 때 시간을 설정할 수 도 있음.
         var c = new Date(2026,7,9);   // 2026년 8월 9일 [ 달쓸때 조심.. 0부터 시작하기 때문에...]
         document.write(c.toLocaleString() + '<br>');

         c= new Date('2026.7.9'); // 2026년 7월 9일   - 문자열로 묶어 주면 7월이 됨.
         document.write(c.toLocaleString() + '<br>');

         c = new Date('Wed Jun 10 2026');
         document.write(c.toLocaleString() + '<br>');


        c = new Date('Wed Jun 10 2026 13:40:13 GMT+0900');
         document.write(c.toLocaleString() + '<br>');

         c = new Date(1000); // 1970.01.01 09:00 기준.. ms 카운트 시간.  - 그래서 1000은 1초
         document.write(c.toLocaleString() + '<br>');

         // 두 날짜 사이의 비교

         var a = new Date('2026.04.29'); // 개강일
         var b = new Date(); // 오늘 

         var diff = b.getTime() - a.getTime(); // 두 날짜의 밀리초 차이 
         var diff = b -a ; // 자동으로 getTime()으로 차이를 구함... -> Date()의 특이한 기능.. 

         // 밀리초를 날짜수로 변경.
         var sec = diff/1000; // ms -> s  로 바꿈.
         var min = sec/60 ;  // s -> m 로 바꿈. 
         var hour = min/60;  // m -> h 
         var day = hour/24;  // h --> day 로 수정. 
         document.write(diff)
         document.write('두 날자의 일수 차이 :  ' + day + '일<br>');

         // 수학기능 중 소수점 날리는 기능 - 파이썬에도 있었음.
         day = Math.floor(day);  // 바닥으로 내림... 그래서 소수점을 아래로 버림.
         document.write('두 날자의 일수 차이 :  ' + day + '일<br>');


         // 네이버에서 시간 구하는 것을 한번 말들어 보자...

         // [기준일 입력완료] 버튼을 클릭했을 때 수행할 작업코드를 작성한 영역(함수)
         function aaa(){
            // in1 요소에 선택된 날짜 값 얻어오기.
            var in1 = document.getElementById('in1');
            var v = in1.value;
            document.write(v + '<br>');

            // var a = new Date();// 현재시간으로 만듦.
            var a = new Date(v);// 위에서 선택한 날짜로 Date객체를 생성
            var b = new Date();

            var diff = b - a;
            day = diff/ (1000*60*60*24);
            day=Math.floor(day); // 소수점 제거.

            if(day>0) {
                document.write('오늘로부터 ' + day + '일 전<br>');
            }else if(day<0) {
                document.write('오늘로부터 ' + day + '일 후<br>');

            }else{
                document.write('오늘<br>')
            }


         }

         // 현재 시간 표시 기능
         function bbb(){
            var d = new Date(); // 현재 시간
            var h4 = document.getElementById('hh');
            h4.innerHTML = d.toLocaleString(); // 우리 날짜 로 찍어줘...

            // 1초마다 bbb()함수가 다시 실행되도록.. 행운의 편지..
            setTimeout('bbb()', 1000); // 1000ms 후에 bbb함수를 다시 실행해....

         }
        
        

    </script>
</head>
<body>
    <hr>
    <h2>경과시간 계산기</h2>
    <input type="date" id="in1">
    <button onclick="aaa()">기준일 입력완료</button>

    <hr>
    <h2>현재 시간 표시</h2>
    <button onclick="bbb()">show clock </button>
    <h4 id="hh">00:00:00</h4>
    
</body>
</html>
