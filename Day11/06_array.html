<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array object</title>

    <script>
        // 5. Array
        // 이미 배열수업에서 배열 다루는 것을 배웠음..

        var aaa = new Array(10,20,30) ; // 객체였음. 
        document.write( typeof(aaa) + '<br>'); // ojbect


        // 배열 객체가 가지고 있는 유용한 기능 ( function - 함수 - method)
        // 1) 배열요소의 값들을, 구분자로 하여 하나의 문자열로 만들어주는 기능
        document.write(aaa.toString() + "<br>");
        // .toString()을 직접 쓰는 경우는 별로 없음. why? 배열 참조변수를 출력하면 자동 toString()해줌. 
        document.write(aaa + '<br>') 
        // toString은 모든 객체가 가지고 있음. 

        //2) 댜른 배열을 이어 붙인 새로운 배열ㅇ르 만들어주는 기능
        var bbb = [ 4,5,6];
        var ccc =aaa.concat(bbb);

        document.write(ccc +'<br>');  // 원본 aaa는 불변...
        document.write(aaa +'<br>');  // 

        // 파이썬의 리스트처럼 + 결합 연산이 될까? --안됨. -> 요소의 결합이 아니라 -- 각 배열의 문자열로 변환 후 문자열 결합을 해 버림. 
        var ddd = aaa + bbb;

        document.write(ddd + '<br>') ; // 배열과 배열을 더했는데 문자열임. 파이썬에서는 됬음. 그래서 가급적 concat으로 해아. 

        document.write(typeof(ddd) + '<br>') ; 

        document.write('<hr>');

        // 3) indexof : 특정한 요소가 몇번째 있는지.. 특정 값이 몇번 위치에 있는지? 인덱스 번호
        document.write(aaa.indexOf(30) + '<br>');
        document.write(aaa.indexOf(40) + '<br>');  // 없으면 -1
        document.write(aaa.indexOf(10,1) + '<br>'); // 1번방 이후부터 10을 찾기.


        // 4) 실제 원본에 영향을 주는 것.. push, pop [stack 구조]

        var stack = [1,2,3,4,5,6,7];
        stack.push(10); // 마지막에 10이 추가됨. 
        document.write(stack + '<br>');

        // 마지막 요소를 빼오기.. [실제 배열에 변화가 생김]

        var e= stack.pop();
        document.write(e + '<br>'); // 10이 나옴.

        document.write(stack + '<br>');
        // 5) push,shift [queue 구조]
        var queue = [1,2,3,4,5];
        queue.push(10);
        document.write(queue + '<br>');

        var e = queue.shift(); // 첫번째 요소 빼오기...
        document.write(e + '<br>');
        document.write(queue + '<br>');
        document.write('<hr>');


        // stack 이라는 자료구조 , 
        // 먼저 들어가는게 가장 마지막에 나옴. FILO : first input last output --> 웹 브라우저의 구조.. 
        // 웹브라우저의 히스토리가 stack 구조임. - 이전내용으로 가게 되면 페이지가 쌓이고 쌓여서 먼저 열린것이 나중에 열림.

        // Queue 구조 
        // 먼저 들어간게 먼저 나온다. 
        // 키보드 버퍼...  1,2,3,4,5 엔터치면 1부터나옴. 이런게 메세지 큐임.    이벤트가 발생한 것이 메세지 큐로 들어감.. 


        // 5) revers - 배열의 저장 순서를 뒤집기 (원본이 변경됨. )

        var aaa = [ 10,20,30,40,50];
        aaa.reverse();
        document.write( aaa + '<hr>');


        // 6) slice - 배열의 일부분을 잘라서 새로운 배열로 리턴... (원본 불변)
        var aaa = [ 10,20,30,40,50,60,70,80,90];
        var bbb = aaa.slice(3); // 3번 위치부터 잘라서 새로운 배열로 리턴
        document.write(bbb + '<br>');
        
        var ccc = aaa.slice(3,6); // 3번부터 6번 전까지.. 잘라서 새로운 배열 리턴.
        document.write(ccc + '<hr>');

        //7) join - 배열의 요소를 특정문자를 구분자로 하여 하나의 문자열로 리턴 (string의 split의 정반대 기능)
        // 배열을 스트링으로 ,, string은 무조건 ,로..

        var aaa = ['sam', 'robin' , 'hong'];
        var bbb = aaa.join("&"); //"sam&robin&hong"
        document.write(bbb + '<hr>');

        //8) sort -정렬. ( 원본 변경됨.)
        var aaa = [3,5,4,8,9,1,6,7];
        aaa.sort(); // 정렬되어 원본이 바뀜.
        document.write(aaa + '<br>');

        // 두자리 이상의 숫자를 정렬해보면??

        var aaa = [ 3,1,15,754, 1234, 54, 90];
        aaa.sort();  // 숫자를 자리수끼리.. 비교하면서.. 순위를 정람...
        document.write(aaa + '<br>'); // 문자일 경우 첫짜리의 값을 정렬, 그 다음 자리를 정렬함.

        // 그래서 정렬을 하는 기준을 결정하는 함수를 이용 [ 정렬기준함수]라고 부름...

        // 6교시
        aaa.sort(function(a,b){ // 오름차순
            return a-b;

        })
        // sort에서 안의 함수는 요소수 만큼 계속 반복, 더이상 움직이지 않을 때까지 아래의 조건을 반복하여 요소의 자리를 바꿈.
        // 양수면 바꾸고 음수면 그대로 둚. 

        document.write(aaa + '<br>');


        aaa.sort(function(a,b){ // 내림차순
            return b-a;

        })
        // sort에서 안의 함수는 요소수 만큼 계속 반복, 더이상 움직이지 않을 때까지 아래의 조건을 반복하여 요소의 자리를 바꿈.
        // 양수면 바꾸고 음수면 그대로 둚. 

        document.write(aaa + '<br>');

        // 이것만 알고리즘으로 sorting하는 알고리즘이 많음. 

        document.write('<hr>');

        //9) filter -- 필터지정함수를 활용 (필터의 기준을 정하는 것임.)
        var scores = [90,75,68,42,78,84,95,100,32,87];
        // 80점 이상의 점부만 뽑아서.. 새로운 배열로 만들어 내기...(필터링)
        var good_scores = scores.filter(function(e,index,array){
            // 필터 조건.. 이 조건이 true 인 요소들만 새 배열에 포함됨.
            // return e>=80;  // 조건만 넣으면 됨. 
            return e>=80 && index>3; // 80점 이상이면서.. 요소위치번호가 3번보다 큰것들...
        });
        // sort{ fuction (요소, 인덱스 , 배열자체){} return 조건 -.false 버려짐, true 는 배열을 다시 만듦. }
        document.write(good_scores + "<br>");

        document.write('<hr>');


        // ECMAScript5 버전에서 새로 추가된 기능들...

        var aaa = [10,20,30,40,50];
        // foreach ()
        // map

        //10) 각각의 배열 요소들에 접근하는 반복기능을 제공
        aaa.forEach(function(e,index,array){
            document.write(e+":" + index + " - " + array.length + '<br>');  // 요소의 갯수만큼 실행이됨. ....파라미터는 순서대로, [ 요소, 인덱스 , 배열]
        });// 각각에 대하여


        //11) forEach처럼 각 요소개수만큼 전달한 함수를 실행해주며... 차이점은 리턴을 통해 새로운 배열을 만들어 줌. 요소가 5개면 무조건 5개, 10개면 10개...
        // aaa 배열의 요소들 마다 x2를 한 새로은 배열을 만들기.
        var bbb=aaa.map(function(e,idx,array){
            return e*2;
        });
        document.write(bbb + '<br>');
        //.map()은 원본 배열을 가지고 조작하여 새로운 배열ㅇ르 만들대 유용. 많이 사용함. 
        // 리엑트 프레임워크에서 많이 사용.


        // .map()에 전달한 함수의 파라미터 개수는 치대 3개이며..순서가 정해져 있음.
        //변수명을 바꿔도 되며.. 필요한 것만 사용해도 됨. 
        var bbb=aaa.map(function(e,idx){
            return e*2;
        });
        document.write(bbb + '<br>');

        var bbb=aaa.map(function(e){
            return e*2;
        });
        document.write(bbb + '<br>');

        var bbb=aaa.map(function(idx){   // idx라고 해도 순서가 중요하기 때문에 idx는 e: 요소와 같다. 
            return idx*2;
        });
        document.write(bbb + '<br>');

        var bbb=aaa.map(function(value){   // idx라고 해도 순서가 중요하기 때문에 idx는 e: 요소와 같다. 
            return value*value;
        });
        document.write(bbb + '<br>');

        // 책 18-2까지 함. 이 책은 뒷부분이 약함. 

        // chat gpt 에서 찾은 표현. [ES6 새로 추가된 함수 ]
        var bbb= aaa.map((value => value*2))
        document.write(bbb + '마지막 테스트 <br>');



</script>
</head>
<body>




    
</body>
</html>


<!-- sort, filter , map , forEach 의 각 파라미터 요소는 결정이 되어 있지만 return 에 대해서는 바꿀수 있다.  -->
 <!-- filter 의 경우 return 의 결과가 조건문 형식으로 되어 있지만 내부에서 동작하는 알고리즘으로 return 이 조건문에 대한 결과로 출력되게 한것이니 유저는 그냥 가져다 사용하기만 하면 됨.  -->
