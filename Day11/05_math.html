<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>math</title>

    <script>
        //4. math - 수학에 관련된 여러 기능들...
        // 특이점. 객체 생성 없이 생성자함수명 만으로 기능 사용이 가능함.

        var n=3.14;
        document.write(Math.floor(n) + '<br>'); // 소수점 내리기 // new 없이 객체의 속성 기능을 사용할 수 있음. 파이썬에도 있음.
        document.write(Math.round(n) + '<br>'); // 반올림.
        document.write(Math.ceil(n) + '<br>'); // 소수점 올리기.

        // 랜덤값 얻어오기.
        var n = Math.random(); // 0.0 ~ 0.999999999999.....
        document.write(n + '<br>');

        // 0~9 사이의 정수를 구하고 싶다면?
        var n = Math.random() * 10;
        n = Math.floor(n);  // 소수점 날리기...

        document.write(n + '<br>');

        // 5~15 사이의 정수를 구하고 싶다면? 
        var n = Math.random() * 11; // 0~10
        n = Math.floor(n) +5;
        document.write(n + '<br>');
    </script>
</head>
<body>
    
</body>
</html>
