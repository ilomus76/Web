<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필 등록</title>

    <style>
        #wrap{
            display:flex; 
            /* // 요소들이 위에서 아래로 놓임. */
            flex-direction : column;
            justify-content: center; 
            align-items: center;

            /* height: 100% ;  */
            height:100vh; 
            /* viewport height 사이즈만큼.. */
            /* //body가 많이 큰게 아니라 안의 요소 높이 사이즈 만큰 되어서 위의걸로.. */
        }


        #img1{
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            cursor:pointer;
            border:2px solid black;
        }

        #in1{
            display:none; 
            /* 안보이게 함. */

        }

        #in2{
            padding: .5rem 1rem;
            text-align: center;
            margin: 1rem;
        }

        #btn1{
            padding: .5rem 1rem;
            background-color: cadetblue;
            border:none;
            border-radius: 8px;
            color: white;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <h2>프로필 등록 페이지</h2>
        <p>프로필 사진을 등록하고 닉네임을 설정하세요</p>
    
    <div>
        <img id="img1" src="./image/ms_01.png" alt="profile image">
        <!-- 이미지를 선택했을때 파일 탐색기가 보여지도록...  -->
         <input id="in1" type="file" accept="image/*">
         <!-- 이미지를 누르면 파일선택 버튼이 눌리게... -->
    </div>
    <div>
        <input type="text" placeholder="닉네임" id="in2">
    </div>
    <div>
        <button id="btn1"> 프로필 등록</button>
	</div>
    </div>
    <!-- 스타일링 하자 위로... -->

    <!-- 위에서 와서 다시 스크립트.. -->
     <script>
        //요소들 참조
        var img1 = document.getElementById('img1');
        var in1 = document.getElementById('in1'); //숨겨ㅈ져 있는 파일탐색기 선택 input요소
        var in2 = document.getElementById('in2');
        var btn1 = document.getElementById('btn1');


        //이미지 요소 클릭 이벤트 처리

        img1.addEventListener('click',function(){
            in1.click(); // 숨겨있던 input요소를 강제로 클릭!!!
        });

        //파일 탐색기의 이미지 선택이 완료되면
        in1.addEventListener('change',function(){
            // 선택한 파일객체 취득
            var file = in1.files[0]; // 여러개 선택일 수 있어서 배열임... 그래서 첫번째
            // 미리보기 과제... 지도 수업날 한것..
            if(file){
                var fr= new FileReader();
                fr.onload=function(){
                    img1.src=fr.result;

                }
                fr.readAsDataURL(file); // 파일을 경로로 불러들여.... 
            }
        })

        // 전송 버튼 클릭 이벤트 처리
        btn1.addEventListener('click',function(){
            // 선택한 파일 정보 얻기
            var file= in1.files[0];

            //파일이 없으면 전송 안하도록...
            if(file){
                //파일과 문자열데이터를 동시에 서버로 전달하려면.. 특별한 택배상자가 필요함.
                var formData = new FormData();
                formData.append('img',file) // 택배상자에 파일 넣기 -식별자와 파일
                formData.append('nickname',in2.value); //문자열로 다르지 않음 -식별자와 값  -글씨를 통째로 보냄.. 대부분 이걸로 보냄.
                // 닉네임 + 프로필사진을 서버로 전송(ajax로)
                fetch('./profileUpload.php',{
                    method:'POST',
                    body:formData  
                    // formData안에 헤더도 있기에 끝
                })
                .then(function(res){return res.text()})
                .then(function(text){alert(text)})

                //이제 profileUpload.php 만들러 가자
            }else{
                alert('사진 변경이 없어서 전송 안함!!!');

            }
            
        })
     </script>
</body>
</html>
