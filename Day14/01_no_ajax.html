
 <!DOCTYPE html>
 <html lang="ko">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>no ajax</title>
    <!-- AJAX 안썼을때 문제점 알아보기 -->
 </head>
 <body>
    <!-- 1. 서버에 있는 텍스트 문서를 읽어오는 요청 HTTP request -->
     <form action="./aaa.txt" method="get">
        <!-- 서버에 있는 문서를 접근 -->
        <input type="submit" value="서버의 텍스트 데이터 불러오기">
     </form>
     <hr>

     <h3>회원가입 페이지</h3>
     <form action="./aaa.php" method="get">
      <input type="text" placeholder="닉네임 입력하세요" name="nickname">
      <!-- get : url? 식별자 =값 & 식별자=값 , post-->
      <input type="text" placeholder="이메일 입력하세요" name="email">

      <input type="submit" value="가입하기">
      <!-- 누르면 서버의 데이타 베이스에 저장해서 그에 대한 결과를 보여주겠다. -->
     </form>
     <hr>
     <textarea cols="50" rows="5"></textarea>
 </body>
 </html>
