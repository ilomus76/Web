<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAX fetch2</title>
    <!-- csv , xml , jason 제어하기 -->

    <script>
        function aaa(){
            //1.CSV 파일을 불러와서 분석하기.. 
            fetch('./files/user_data.csv').then(function(response){// 내려받아... 경로에서... 그리고 나서 함수하나가 응답받을거야.
                return response.text(); // 2진수로 되어 있으니 텍스트로 만들어줘
            }).then(function(text){ // 그리고 나서 함수로 텍스트를 읽어올 거야.
                // alert(text);//읽어온 글씨 확인

                // 확인 후  , CSV 를 분석햐여 각각의 값들을 분리해보기
                //먼저 하나의 문자열을 줄바꿈을 이용해서 리스트로 만들기..
                // 먼저 . 줄바꿈 문자(\n)를 구분자로 하여 분리하여 배열로 만들기

                var users = text.split('\n');
                // alert(users.length); // 배열의 길이.

                // 각 줄마다, 기준으로 값들이 있으니..이를 또 분리..하기.
                // var values = users[0].split(',');
                // alert(values.length);
                // 여러줄이니..반복문으로 처리.
                var age_sum = 0; 
                var s="";
                // s += 'aaa'
                for (var n=1;n<users.length;n++){  // 0번 요소는 컴룸 제목이기 에 데이터가 아니어서 제외.
                    values = users[n].split(',');
                    var name=values[0];
                    var age=values[1];
                    var address = values[2];
                    s +='<p>';
                    s += '이름: ' + name + '<br>';
                    s += '나이: ' + age +'<br>';
                    s += '주소: ' + address + '<br>';
                    s += '</p>';

                    //나이값을 누적... (추출한 age는 문자열. 그래서 parseInt해야함.)
                    age_sum += parseInt(age);
                }// ----------------------------------

                // 누적된 나이를 통해 평균나이를 계산
                s += "평균나이 : " + (age_sum/(users.length-1));
                // 위에서 만들어진 s 문자열을 div 요소안에 넣기
                // 동적 화면 생성 : 넣어서 화면에 넣음.
                document.getElementById('result').innerHTML = s; // 요소를 찾아서 innerHTML에 s를 넣어...
            }) 
        }  
        // ################################################################

        function bbb(){
            // 2. xml 파일을 읽어와서 분석하기.. HTML과 비슷해서 상속 관계를 알면 됨.
            fetch('./files/user_data.xml')
            .then(function(res){  // response 는 res든 아무것이나 사용해도 됨
                return res.text();

            })
            .then(function(text){
                // alert(text);

                //XML 분석하기... 너무 복잡해서 split으로 하기 힘듦.
                // xml을 DOM tree 구조로 만들어서 요소들을 찾기 편하게 해주는 내장 객체 생성[XML문자열을 -->DOM 객체로 바꿔주는 것. (작은 document객체로 생각하면 됨)]
                var parser = new DOMParser(); // DOM를 분석해주는 것을 만들어라... 즉, 상속관계... document object model
                // [xml 문자열 --> DOM객체(작은 document객체)]
                var doc = parser.parseFromString(text,'application/xml');// 너가 읽어온 xml을 분석할거야.
                // xml, csv ,json 은 전부 applicaiton을 위한 데이타라고 표현하는 xml이라고 한다. 

                //태그 이름이 'user'인 요소들을 찾기
                var users = doc.getElementsByTagName('user');//user라는 태그이름을 찾아... 복수여서 s
                // alert(users.length);

                //user 개수만큼 반복하면서 안에 있는 name, age, address 태그의 값들을 취득.
                //하지만 그럴 필요없을 듯 하다.
                //name, age, address 태그들을 사용하는 요소들을 각각 찾기
                var names = doc.getElementsByTagName('name');
                var ages = doc.getElementsByTagName('age');
                var addresses = doc.getElementsByTagName('address');

                // alert(names.length);   // alert는 동기식방식이라 하나가 끝나야 다음이 동작.
                // alert(ages.length);
                // alert(addresses.length);

                // alert(names);  // object HTMLcollection
                // alert(names[0]);  // object HTML element
                // alert(names[0].textContent); 
                // 각 요소들의 개수만큼 반복하면서.. 이름, 나이 , 주소 정보를 추출

                var s="";
                for(var n=0;n<users.length; n++){
                    s += "<p>";
                    s += names[n].textContent + ":" + ages[n].textContent + " - " + addresses[n].textContent;
                    s += '</p>';
                }// -------------------------------

                document.getElementById('result').innerHTML = s;

                //html의 글자들은 모두 개발자가 쓴게 아니라 게시판에 사용자가 쓴글을 가져오는 것이다......

            })
        }
        // #############################################

        function ccc(){
            //3. JSOn 파일을 읽어와서 분석하기...
            fetch('./files/user_data.json')
            .then(function(res){return res.text()})
            .then(function(text){
                // alert(text);
                // json형식의 문자열을 JS 언어의 리터럴 객체로 변환해주는 내장기능
                var json = JSON.parse(text); // 멤버변수로 하겠다.

                // alert(json.users.length);//식별자들을 멤버변수 다루듯이
                var users=json.users;

                // var p = { name:'sam', age:20} // 객체.
                // var s = { 'name':'sam', 'age':20} // 문자

                //users 배열의 개수만큼 반복하면서 [이름,나이,주소] 추출
                var s = "";
                for(var n=0; n<users.length; n++){
                    s +=users[n].name + ", " ;
                    s +=users[n].age + ",";
                    s +=users[n].address + '<br>'

                }
                document.getElementById('result').innerHTML=s;

            })

        }
    </script>
</head>
<body>
    <button onclick="aaa()">csv 파일 분석하기</button>
    <button onclick="bbb()">xml 파일 분석하기</button>
    <button onclick="ccc()">json 파일 분석하기</button>
    <hr>
    <div id="result"></div>

    

</body>
</html>
