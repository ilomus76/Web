<!-- 게시판 보여주는 곳 -->
 <!DOCTYPE html>
 <html lang="ko">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자유 게시판</title>
    <!-- 외부 스타일시트 연결 -->
     <link rel="stylesheet" href="./css/index.css">

     <!-- 외부 스크립트 작성 -->
      <script src="./js/index.js"></script>
 </head>
 <body onload="loaded()"> 
    <!-- body의 요소가 로드되면 loaded 실행  -->
    <!-- 구성물들을 만들어라.. -->
     <!-- 줄여도 가운데.. 얼마이상되면 줄여줄지 않음.. div -->

     <!-- 콘텐츠가 표시되는 영역 -->
      <div class="board_wrap">
        <!-- 1. 게시판 제목 영역 -->
         <!-- 레이아웃 구조 부터 봐라 -->
          <div class="board_title">
            <h2>자유 게시판</h2>
            <p>자유롭게 게시글을 작성하며 이야기를 나누세요.</p>
          </div>
          <!-- 페이지 네이션 -->
          <!-- 2. 게시판 테이블(표)가 그려질 메인 영역 ( 테이블, 페이지네이션, 등록버튼) -->
           <div class="board_list_wrap">
            <!-- 2.1 테이블 영역 -->
             <table class="board_list">
                <!-- 1) 컬룸 제목줄 -->
                <tr class="colum_title">
                    <th class="col_no">번호</th>
                    <th class="col_title">제목</th>
                    <th class="col_writer">글쓴이</th>
                    <th class="col_date">작성일</th>
                    <th class="col_hits">조회</th>
                </tr>
                <!-- 2) 게시글 데이터들 표시 영역(php 난 JS 반복문으로 구현예정)~ 우선 디자인 목적으로 가짜 데이터 구성 -->
                <!-- <tr>
                    <td class="col_no">1</td>
                    <td class="col_title"><a href="./board/view.html?no=1">글제목#1</a></td> -->
                    <!-- html이 똑같고 파라미터만 달리해서 보낼 수 있음. -->
                    <!-- <td class="col_writer">sam</td>
                    <td class="col_date">2026.06.15</td>
                    <td class="col_hits">10</td>
                </tr> -->
                
             </table>

            <!-- 2.2 페이지 네애션 영역 ( 원래는 php나 JS로 동적 구성해야 함) -->
             <div class="board_pagination">
                <a href=""> &lt;&lt; </a>
                <!-- 엔티티 코드 <<< 를 써도 되지만 엔티티 코드 로 사용 -->
                <a href="" class="btn" onclick="prevPage(); return false;"> &lt; </a>
                <a href="" class="btn selected"> 1 </a> 
                <!-- 클래스 명이 2개인것. btn + selected ( JS 로 선택변경할때 이 클래스명을 다른 버튼으로 이동) -->
                <a href="" class="btn"> 2 </a>
                <a href="" class="btn"> 3 </a>
                <a href="" class="btn"> 4 </a>
                <a href="" class="btn"> 5 </a>
                <a href="" class="btn" onclick="nextPage(); return false;"> &gt; </a>
                <!-- 엔티티 코드 <<< 를 써도 되지만 엔티티 코드 로 사용 -->
                <a href="" class="btn" > &gt;&gt; </a>

                <!-- 모든 페이지네이션이 네모라 스타일링을 같이 하기 위해 클래스지정. -->




             </div>

            <!-- 2.3 등록 버튼 영역 -->
             <div class="btn_wrap">
                <a href="./board/write.html">등록</a>
                <!-- 버튼 모양이지만 앵커다. -->
                 <!-- css로 이동 : css만 모아놓는 폴더 css로 가자-->
                  <!-- 외부 스타일시트 연결 -->

             </div>
           </div>
      </div>
    
 </body>
 </html>
